spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campuspulse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8081}
embedding.service.url=${EMBEDDING_SERVICE_URL:http://127.0.0.1:8000}

logging.level.org.springframework.security=DEBUG

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# LLM Configuration
llm.api.url=https://api.groq.com/openai/v1/chat/completions
llm.api.key=${LLM_API_KEY:${GROQ_API_KEY:}}
llm.model=openai/gpt-oss-20b
