spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campuspulse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# Schema: Flyway scripts in db/migration are the source of truth.
# Existing databases (created before Flyway) are marked as V1 and get V2+.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Flyway owns the schema; Hibernate must not change it (it did once when Flyway was
# missing from an IDE classpath, leaving the schema half-updated).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8081}
embedding.service.url=${EMBEDDING_SERVICE_URL:http://127.0.0.1:8000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Comma-separated emails that get the ADMIN role (job catalog management)
app.admin-emails=${ADMIN_EMAILS:}

# Local demo only: when set, creates admin@ / faculty@ / student@campuspulse.local
app.demo-users-password=${DEMO_USERS_PASSWORD:}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# LLM Configuration
# AI providers (change 050), all OpenAI-compatible chat APIs. Tried in llm.order; a provider
# without a key is skipped. vision-model is used to read page images (blank = no images).
llm.order=${LLM_ORDER:llama,gemini,groq}

llm.llama.url=${LLAMA_API_URL:https://api.llama.com/compat/v1/chat/completions}
llm.llama.key=${LLAMA_API_KEY:}
llm.llama.model=${LLAMA_MODEL:Llama-4-Maverick-17B-128E-Instruct-FP8}
llm.llama.vision-model=${LLAMA_VISION_MODEL:Llama-4-Maverick-17B-128E-Instruct-FP8}

llm.gemini.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
llm.gemini.key=${GEMINI_API_KEY:}
llm.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
llm.gemini.vision-model=${GEMINI_VISION_MODEL:gemini-2.5-flash}

llm.groq.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
llm.groq.key=${GROQ_API_KEY:${LLM_API_KEY:}}
llm.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
llm.groq.vision-model=${GROQ_VISION_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}
llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:120}

# Skill-to-topic similarity cut-offs (cosine, 0..1), calibrated on data/eval (ai-service/tools/calibrate.py)
matching.matched-threshold=${MATCHING_MATCHED_THRESHOLD:0.50}
matching.partial-threshold=${MATCHING_PARTIAL_THRESHOLD:0.25}

# Browser origins allowed to call the API (comma-separated). Change 047.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Requests per minute per client IP (0 = off). Change 047.
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH:10}
app.rate-limit.ai-per-minute=${RATE_LIMIT_AI:30}
