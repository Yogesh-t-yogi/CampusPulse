spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campuspulse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# Schema: Flyway scripts in db/migration are the source of truth.
# Existing databases (created before Flyway) are marked as V1 and get V2+.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Kept as a safety net until Flyway is proven on real data; switch to "validate" later.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8081}
embedding.service.url=${EMBEDDING_SERVICE_URL:http://127.0.0.1:8000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Comma-separated emails that get the ADMIN role (job catalog management)
app.admin-emails=${ADMIN_EMAILS:}

# Local demo only: when set, creates admin@ / faculty@ / student@campuspulse.local
app.demo-users-password=${DEMO_USERS_PASSWORD:}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# LLM Configuration
llm.api.url=https://api.groq.com/openai/v1/chat/completions
llm.api.key=${LLM_API_KEY:${GROQ_API_KEY:}}
llm.model=openai/gpt-oss-20b
llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:120}

# Skill-to-topic similarity cut-offs (cosine, 0..1), calibrated on data/eval (ai-service/tools/calibrate.py)
matching.matched-threshold=${MATCHING_MATCHED_THRESHOLD:0.50}
matching.partial-threshold=${MATCHING_PARTIAL_THRESHOLD:0.25}
