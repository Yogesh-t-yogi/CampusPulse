# Serve the React app; unknown paths fall back to index.html so page URLs
# like /gap-analysis work on refresh.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Syllabus PDFs are up to 10 MB (backend limit); allow a little more for the form data.
    client_max_body_size 12m;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
