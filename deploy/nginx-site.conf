# Example Nginx site for a production server (one domain, HTTPS).
# The frontend is built with VITE_API_BASE_URL=https://campuspulse.example.edu (same domain),
# and /api/ is passed to the backend on port 8081. Replace the domain and certificate paths.
# Certificates: `sudo certbot --nginx -d campuspulse.example.edu` (Let's Encrypt, free).

server {
    listen 80;
    server_name campuspulse.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name campuspulse.example.edu;

    ssl_certificate     /etc/letsencrypt/live/campuspulse.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campuspulse.example.edu/privkey.pem;

    # Syllabus PDFs: the backend accepts 10 MB files (11 MB requests); keep this a bit higher.
    client_max_body_size 12m;

    # React app (frontend container or built files)
    location / {
        proxy_pass http://127.0.0.1:5173;
    }

    # API. AI calls (recommendations, syllabus reading) can take a few minutes.
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
