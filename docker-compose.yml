# Local run of the whole stack: docker compose up --build
# Needs a .env file next to this one (see .env.example).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: campuspulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"   # database reachable from this machine only
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campuspulse"]
      interval: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    # No login on the embedding service: reachable from this machine and the backend only.
    ports:
      - "127.0.0.1:8000:8000"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/campuspulse
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EMBEDDING_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
      LLM_ORDER: ${LLM_ORDER:-gemini,groq}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEMO_USERS_PASSWORD: ${DEMO_USERS_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SELF_REGISTRATION: ${SELF_REGISTRATION:-false}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-http://localhost:5173}
      LOG_FILE: /app/logs/campuspulse.log
    volumes:
      - ./logs:/app/logs          # rotated log files, kept on the host
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8081
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
